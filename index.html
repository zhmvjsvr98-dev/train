<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOMS - Train Operation Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="data/sample-data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/login.js" defer></script>
</head>

<body class="login-page">

    <div class="login-overlay">

        <div class="login-container">

            <div class="logo-area">

                <div class="jr-logo">
                    JR
                </div>

                <h1>
                    統合列車運行管理システム
                </h1>

                <p>
                    TOMS : Train Operation Management System
                </p>

            </div>

            <form id="loginForm">

                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        placeholder="ユーザーID"
                        value="admin">

                </div>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="パスワード"
                        value="password">

                </div>

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe">

                        ログイン状態を保持する

                    </label>

                </div>

                <button
                    type="submit"
                    class="btn-login">

                    ログイン

                </button>

            </form>

        </div>

    </div>

</body>

</html>
