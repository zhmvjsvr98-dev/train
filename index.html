<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOMS - Train Operation Management System</title>

<style>

:root{
--bg:#08111F;
--sidebar:#0F1B2D;
--panel:#15253D;
--accent:#1E88E5;
--success:#28A745;
--warning:#FF9800;
--danger:#F44336;
--text:#FFFFFF;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:var(--bg);
color:white;
}

/* =====================
LOGIN
===================== */

.login-screen{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
linear-gradient(135deg,#08111F,#15253D);

}

.login-box{

width:500px;

padding:40px;

background:rgba(15,27,45,.95);

border-radius:12px;

box-shadow:0 0 30px rgba(0,0,0,.5);

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logo h1{

font-size:64px;

margin-bottom:10px;

}

.logo h2{

margin-bottom:10px;

}

.input{

width:100%;

padding:12px;

margin-bottom:15px;

border-radius:6px;

border:1px solid #32445e;

background:#08111F;

color:white;

}

.btn{

width:100%;

padding:12px;

background:#1E88E5;

border:none;

border-radius:6px;

color:white;

cursor:pointer;

font-size:16px;

}

.btn:hover{

background:#42A5F5;

}

/* =====================
DASHBOARD
===================== */

.dashboard{

display:none;

height:100vh;

}

.sidebar{

width:240px;

background:#0F1B2D;

padding:20px;

}

.sidebar h2{

margin-bottom:30px;

}

.sidebar ul{

list-style:none;

}

.sidebar li{

padding:12px;

margin-bottom:8px;

background:#15253D;

border-radius:6px;

}

.content{

flex:1;

display:flex;
flex-direction:column;

}

.topbar{

height:60px;

background:#15253D;

display:flex;

justify-content:space-between;
align-items:center;

padding:0 20px;

}

.main{

padding:20px;

overflow:auto;

}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:20px;

}

.card{

background:#15253D;

padding:20px;

border-radius:10px;

}

.card h3{

font-size:18px;

margin-bottom:10px;

}

.card .number{

font-size:40px;

font-weight:bold;

}

.green{
border-left:5px solid #28A745;
}

.orange{
border-left:5px solid #FF9800;
}

.red{
border-left:5px solid #F44336;
}

.blue{
border-left:5px solid #1E88E5;
}

.layout{

display:grid;

grid-template-columns:2fr 1fr;

gap:20px;

}

.panel{

background:#15253D;

padding:20px;

border-radius:10px;

}

.rail{

height:220px;

position:relative;

margin-top:20px;

}

.line{

position:absolute;

top:100px;

left:40px;

right:40px;

height:4px;

background:#28A745;

}

.station{

width:20px;
height:20px;

border-radius:50%;

background:white;

border:4px solid #28A745;

position:absolute;

top:92px;

}

.train{

position:absolute;

top:70px;

font-size:24px;

}

table{

width:100%;
border-collapse:collapse;

margin-top:10px;

}

th,td{

padding:10px;

border-bottom:1px solid rgba(255,255,255,.1);

text-align:left;

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

<div class="login-box">

<div class="logo">

<h1>JR</h1>

<h2>統合列車運行管理システム</h2>

<p>TOMS : Train Operation Management System</p>

</div>

<input class="input" placeholder="ユーザーID" value="admin">

<input class="input" type="password" placeholder="パスワード" value="password">

<button class="btn" onclick="login()">
ログイン
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

<div class="sidebar">

<h2>TOMS</h2>

<ul>
<li>ダッシュボード</li>
<li>時刻表管理</li>
<li>列車管理</li>
<li>遅延・運休管理</li>
<li>インシデント管理</li>
<li>車両管理</li>
<li>レポート</li>
<li>設定</li>
</ul>

</div>

<div class="content">

<div class="topbar">

<div>
統合列車運行管理システム
</div>

<div id="clock"></div>

<button class="btn" style="width:120px" onclick="logout()">
ログアウト
</button>

</div>

<div class="main">

<div class="cards">

<div class="card green">
<h3>運行中</h3>
<div class="number">28</div>
</div>

<div class="card orange">
<h3>遅延</h3>
<div class="number">3</div>
</div>

<div class="card red">
<h3>運休</h3>
<div class="number">1</div>
</div>

<div class="card blue">
<h3>点検中</h3>
<div class="number">34</div>
</div>

</div>

<div class="layout">

<div class="panel">

<h2>路線運行状況マップ</h2>

<div class="rail">

<div class="line"></div>

<div class="station" style="left:50px"></div>
<div class="station" style="left:180px"></div>
<div class="station" style="left:310px"></div>
<div class="station" style="left:440px"></div>
<div class="station" style="left:570px"></div>
<div class="station" style="left:700px"></div>

<div class="train" style="left:170px;color:#28A745">
🚆
</div>

<div class="train" style="left:430px;color:#FF9800">
🚆
</div>

<div class="train" style="left:650px;color:#F44336">
🚆
</div>

</div>

</div>

<div class="panel">

<h2>インシデント一覧</h2>

<table>

<tr>
<th>時刻</th>
<th>内容</th>
</tr>

<tr>
<td>14:20</td>
<td>中央線遅延</td>
</tr>

<tr>
<td>13:10</td>
<td>車両故障</td>
</tr>

<tr>
<td>11:45</td>
<td>設備点検</td>
</tr>

</table>

</div>

</div>

</div>

</div>

</div>

<script>

function login(){

localStorage.setItem(
"tomsLogin",
"true"
);

document.getElementById(
"loginScreen"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="flex";

}

function logout(){

localStorage.removeItem(
"tomsLogin"
);

location.reload();

}

if(localStorage.getItem("tomsLogin")){

document.getElementById(
"loginScreen"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="flex";

}

function updateClock(){

document.getElementById(
"clock"
).innerHTML=
new Date().toLocaleString("ja-JP");

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
