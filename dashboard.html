<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TOMS Dashboard</title>

<link
rel="stylesheet"
href="../css/style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="card-grid">

    <div class="info-card">
        <h3>運行中本数</h3>
        <div
            id="runningCount"
            class="value success">0</div>
    </div>

    <div class="info-card">
        <h3>遅延本数</h3>
        <div
            id="delayCount"
            class="value warning">0</div>
    </div>

    <div class="info-card">
        <h3>運休本数</h3>
        <div
            id="stopCount"
            class="value danger">0</div>
    </div>

    <div class="info-card">
        <h3>点検中車両</h3>
        <div
            id="vehicleCount"
            class="value primary">0</div>
    </div>

    <div class="info-card">
        <h3>重大インシデント</h3>
        <div
            id="emergencyCount"
            class="value danger">0</div>
    </div>

</div>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-train"></i>
            TOMS
        </div>

        <nav>

            <a href="dashboard.html">
                <div class="menu-item active">
                    <i class="fa-solid fa-gauge-high"></i>
                    ダッシュボード
                </div>
            </a>

            <a href="timetable.html">
                <div class="menu-item">
                    <i class="fa-solid fa-clock"></i>
                    時刻表管理
                </div>
            </a>

            <a href="trains.html">
                <div class="menu-item">
                    <i class="fa-solid fa-train-subway"></i>
                    列車管理
                </div>
            </a>

            <a href="delay.html">
                <div class="menu-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    遅延・運休管理
                </div>
            </a>

            <a href="incident.html">
                <div class="menu-item">
                    <i class="fa-solid fa-bolt"></i>
                    インシデント管理
                </div>
            </a>

            <a href="vehicle.html">
                <div class="menu-item">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    車両管理
                </div>
            </a>

            <a href="report.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-column"></i>
                    レポート
                </div>
            </a>

            <a href="settings.html">
                <div class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    設定
                </div>
            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <!-- Header -->

        <div class="top-header">

            <div>

                <h2>
                    統合列車運行管理システム
                </h2>

            </div>

            <div class="header-right">

                <span id="currentTime"></span>

                <span>
                    運行管理者：admin
                </span>

                <button
                    id="logoutBtn"
                    class="logout-btn">

                    ログアウト

                </button>

            </div>

        </div>

        <!-- Cards -->

        <div class="card-grid">

            <div class="info-card">

                <h3>
                    運行中本数
                </h3>

                <div
                    id="runningCount"
                    class="value success">

                    0

                </div>

            </div>

            <div class="info-card">

                <h3>
                    遅延本数
                </h3>

                <div
                    id="delayCount"
                    class="value warning">

                    0

                </div>

            </div>

            <div class="info-card">

                <h3>
                    運休本数
                </h3>

                <div
                    id="stopCount"
                    class="value danger">

                    0

                </div>

            </div>

            <div class="info-card">

                <h3>
                    点検中車両
                </h3>

                <div
                    id="vehicleCount"
                    class="value primary">

                    0

                </div>

            </div>

        </div>

        <!-- Route Map -->

        <div class="panel">

            <h2 class="panel-title">
                路線運行状況
            </h2>

            <div
                id="routeMap"
                class="route-map">

            </div>

        </div>

        <div
        style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:20px;">

            <!-- Notice -->

            <div class="panel">

                <h2 class="panel-title">
                    お知らせ
                </h2>

                <ul id="noticeList">

                </ul>

            </div>

            <!-- Incident -->

            <div class="panel">

                <h2 class="panel-title">
                    インシデント一覧
                </h2>

                <div
                class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>発生日時</th>
                                <th>区分</th>
                                <th>内容</th>
                                <th>状態</th>

                            </tr>

                        </thead>

                        <tbody id="incidentTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
