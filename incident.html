<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TOMS - インシデント管理</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="page-container">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-train"></i>
            TOMS
        </div>

        <a href="dashboard.html"><div class="menu-item">ダッシュボード</div></a>
        <a href="timetable.html"><div class="menu-item">時刻表管理</div></a>
        <a href="trains.html"><div class="menu-item">列車管理</div></a>
        <a href="delay.html"><div class="menu-item">遅延・運休管理</div></a>

        <a href="incident.html">
            <div class="menu-item active">
                インシデント管理
            </div>
        </a>

        <a href="vehicle.html"><div class="menu-item">車両管理</div></a>
        <a href="report.html"><div class="menu-item">レポート</div></a>

    </aside>

    <main class="main-content">

        <div class="top-header">

            <h2>
                インシデント管理
            </h2>

            <div class="header-right">

                <span id="currentTime"></span>

                <button
                    id="logoutBtn"
                    class="logout-btn">

                    ログアウト

                </button>

            </div>

        </div>

        <div class="panel">

            <h3 class="panel-title">
                インシデント登録
            </h3>

            <div class="form-grid">

                <input
                type="datetime-local"
                id="incidentDate">

                <select id="incidentType">

                    <option>鉄道事故</option>
                    <option>信号故障</option>
                    <option>設備故障</option>
                    <option>車両故障</option>
                    <option>停電</option>

                </select>

                <input
                id="incidentContent"
                placeholder="内容">

                <select id="incidentStatus">

                    <option>対応中</option>
                    <option>解決済</option>
                    <option>終了</option>

                </select>

                <select id="incidentLevel">

                    <option>低</option>
                    <option>中</option>
                    <option>高</option>
                    <option>重大</option>

                </select>

            </div>

            <br>

            <button
                id="addBtn"
                class="save-btn">

                登録

            </button>

        </div>

        <div class="panel">

            <input
                type="text"
                id="searchBox"
                class="search-box"
                placeholder="内容検索">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th data-sort="datetime">
                                発生日時 ▲▼
                            </th>

                            <th data-sort="category">
                                区分 ▲▼
                            </th>

                            <th data-sort="content">
                                内容 ▲▼
                            </th>

                            <th data-sort="status">
                                状態 ▲▼
                            </th>

                            <th data-sort="level">
                                緊急度 ▲▼
                            </th>

                            <th>
                                操作
                            </th>

                        </tr>

                    </thead>

                    <tbody id="incidentTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<div
id="editModal"
class="modal">

    <div class="modal-content">

        <h2>インシデント編集</h2>

        <br>

        <input
            type="hidden"
            id="editId">

        <div class="form-grid">

            <input
            type="datetime-local"
            id="editDate">

            <select id="editType">

                <option>鉄道事故</option>
                <option>信号故障</option>
                <option>設備故障</option>
                <option>車両故障</option>
                <option>停電</option>

            </select>

            <input id="editContent">

            <select id="editStatus">

                <option>対応中</option>
                <option>解決済</option>
                <option>終了</option>

            </select>

            <select id="editLevel">

                <option>低</option>
                <option>中</option>
                <option>高</option>
                <option>重大</option>

            </select>

        </div>

        <br>

        <button
            id="updateBtn"
            class="save-btn">

            更新

        </button>

        <button
            id="closeModal"
            class="logout-btn">

            閉じる

        </button>

    </div>

</div>

<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/incident.js"></script>

</body>
</html>
