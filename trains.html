<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TOMS - 列車管理</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="page-container">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-train"></i>
            TOMS
        </div>

        <nav>

            <a href="dashboard.html">
                <div class="menu-item">
                    <i class="fa-solid fa-gauge-high"></i>
                    ダッシュボード
                </div>
            </a>

            <a href="timetable.html">
                <div class="menu-item">
                    <i class="fa-solid fa-clock"></i>
                    時刻表管理
                </div>
            </a>

            <a href="trains.html">
                <div class="menu-item active">
                    <i class="fa-solid fa-train-subway"></i>
                    列車管理
                </div>
            </a>

            <a href="delay.html">
                <div class="menu-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    遅延・運休管理
                </div>
            </a>

            <a href="incident.html">
                <div class="menu-item">
                    <i class="fa-solid fa-bolt"></i>
                    インシデント管理
                </div>
            </a>

            <a href="vehicle.html">
                <div class="menu-item">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    車両管理
                </div>
            </a>

            <a href="report.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-column"></i>
                    レポート
                </div>
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <div class="top-header">

            <h2>列車管理</h2>

            <div class="header-right">

                <span id="currentTime"></span>

                <button
                    id="logoutBtn"
                    class="logout-btn">

                    ログアウト

                </button>

            </div>

        </div>

        <!-- 登録フォーム -->

        <div class="panel">

            <h3 class="panel-title">
                列車登録
            </h3>

            <div class="form-grid">

                <input
                    id="trainNo"
                    placeholder="列車番号">

                <input
                    id="formation"
                    placeholder="編成番号">

                <input
                    id="trainType"
                    placeholder="種別">

                <select id="status">

                    <option>正常</option>
                    <option>遅延</option>
                    <option>運休</option>
                    <option>回送</option>

                </select>

                <select id="position">

                    <option>東京</option>
                    <option>神田</option>
                    <option>秋葉原</option>
                    <option>上野</option>
                    <option>日暮里</option>
                    <option>池袋</option>
                    <option>新宿</option>
                    <option>渋谷</option>
                    <option>品川</option>

                </select>

                <input
                    id="note"
                    placeholder="備考">

            </div>

            <br>

            <button
                id="addTrainBtn"
                class="save-btn">

                登録

            </button>

        </div>

        <!-- 一覧 -->

        <div class="panel">

            <input
                type="text"
                id="searchBox"
                class="search-box"
                placeholder="列車番号・編成・位置検索">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th data-sort="trainNo">列車番号 ▲▼</th>

                            <th data-sort="formation">編成番号 ▲▼</th>

                            <th data-sort="type">種別 ▲▼</th>

                            <th data-sort="status">状態 ▲▼</th>

                            <th data-sort="position">現在位置 ▲▼</th>

                            <th>備考</th>

                            <th>操作</th>

                        </tr>

                    </thead>

                    <tbody id="trainTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- 編集モーダル -->

<div
id="editModal"
class="modal">

    <div class="modal-content">

        <h2>列車編集</h2>

        <br>

        <input
            type="hidden"
            id="editId">

        <div class="form-grid">

            <input id="editTrainNo">

            <input id="editFormation">

            <input id="editType">

            <select id="editStatus">

                <option>正常</option>
                <option>遅延</option>
                <option>運休</option>
                <option>回送</option>

            </select>

            <select id="editPosition">

                <option>東京</option>
                <option>神田</option>
                <option>秋葉原</option>
                <option>上野</option>
                <option>日暮里</option>
                <option>池袋</option>
                <option>新宿</option>
                <option>渋谷</option>
                <option>品川</option>

            </select>

            <input id="editNote">

        </div>

        <br>

        <button
            id="updateBtn"
            class="save-btn">

            更新

        </button>

        <button
            id="closeModal"
            class="logout-btn">

            閉じる

        </button>

    </div>

</div>

<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/trains.js"></script>

</body>
</html>
