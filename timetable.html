<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TOMS - 時刻表管理</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="page-container">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-train"></i>
            TOMS
        </div>

        <nav>

            <a href="dashboard.html">
                <div class="menu-item">
                    <i class="fa-solid fa-gauge-high"></i>
                    ダッシュボード
                </div>
            </a>

            <a href="timetable.html">
                <div class="menu-item active">
                    <i class="fa-solid fa-clock"></i>
                    時刻表管理
                </div>
            </a>

            <a href="trains.html">
                <div class="menu-item">
                    <i class="fa-solid fa-train-subway"></i>
                    列車管理
                </div>
            </a>

            <a href="delay.html">
                <div class="menu-item">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    遅延・運休管理
                </div>
            </a>

            <a href="incident.html">
                <div class="menu-item">
                    <i class="fa-solid fa-bolt"></i>
                    インシデント管理
                </div>
            </a>

            <a href="vehicle.html">
                <div class="menu-item">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    車両管理
                </div>
            </a>

            <a href="report.html">
                <div class="menu-item">
                    <i class="fa-solid fa-chart-column"></i>
                    レポート
                </div>
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <div class="top-header">

            <h2>時刻表管理</h2>

            <div class="header-right">

                <span id="currentTime"></span>

                <button
                    id="logoutBtn"
                    class="logout-btn">

                    ログアウト

                </button>

            </div>

        </div>

        <!-- 登録フォーム -->

        <div class="panel">

            <h3 class="panel-title">
                時刻表登録
            </h3>

            <div class="form-grid">

                <input
                    id="trainNo"
                    placeholder="列車番号">

                <input
                    id="trainType"
                    placeholder="種別">

                <input
                    id="startStation"
                    placeholder="始発駅">

                <input
                    id="endStation"
                    placeholder="終着駅">

                <input
                    type="time"
                    id="departureTime">

                <input
                    type="time"
                    id="arrivalTime">

            </div>

            <br>

            <button
                id="addBtn"
                class="save-btn">

                登録

            </button>

        </div>

        <!-- 検索 -->

        <div class="panel">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="列車番号・駅名検索">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th data-sort="trainNo">
                                列車番号 ▲▼
                            </th>

                            <th data-sort="type">
                                種別 ▲▼
                            </th>

                            <th data-sort="start">
                                始発駅 ▲▼
                            </th>

                            <th data-sort="end">
                                終着駅 ▲▼
                            </th>

                            <th>
                                出発
                            </th>

                            <th>
                                到着
                            </th>

                            <th>
                                操作
                            </th>

                        </tr>

                    </thead>

                    <tbody id="timetableTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- 編集モーダル -->

<div
id="editModal"
class="modal">

    <div class="modal-content">

        <h2>
            時刻表編集
        </h2>

        <br>

        <input type="hidden" id="editId">

        <div class="form-grid">

            <input id="editTrainNo">

            <input id="editType">

            <input id="editStart">

            <input id="editEnd">

            <input type="time" id="editDeparture">

            <input type="time" id="editArrival">

        </div>

        <br>

        <button
            id="updateBtn"
            class="save-btn">

            更新

        </button>

        <button
            id="closeModal"
            class="logout-btn">

            閉じる

        </button>

    </div>

</div>

<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/timetable.js"></script>

</body>
</html>
